<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZXSPRD AI — Edge Kiosk Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<style>
  /* Kiosk Specific Overrides */
  body.kiosk-mode {
    background: #04070F;
    overflow: hidden;
    height: 100vh;
  }
  .kiosk-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
    gap: 16px;
  }

  /* Emergency Broadcast Banner */
  .broadcast-banner {
    background: linear-gradient(90deg, rgba(245,158,11,0.15), rgba(239,68,68,0.15));
    border: 1px solid rgba(245,158,11,0.4);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: bannerPulse 2s infinite;
    box-shadow: 0 0 20px rgba(245,158,11,0.1);
  }
  @keyframes bannerPulse {
    0%, 100% { border-color: rgba(245,158,11,0.4); box-shadow: 0 0 20px rgba(245,158,11,0.1); }
    50% { border-color: rgba(245,158,11,0.8); box-shadow: 0 0 30px rgba(245,158,11,0.25); }
  }
  .broadcast-banner .left { display: flex; align-items: center; gap: 12px; color: #FCD34D; font-weight: 600; font-size: 14px; }
  .broadcast-banner .icon-wrap { width: 32px; height: 32px; background: rgba(245,158,11,0.2); border-radius: 8px; display: grid; place-items: center; }
  .broadcast-banner .time { font-family: var(--mono); font-size: 11px; color: #F59E0B; opacity: 0.8; }

  /* Main Kiosk Grid */
  .kiosk-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
    min-height: 0; /* Crucial for flex/grid overflow */
  }

  /* Left Column: Session & Speakers */
  .session-col {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .session-header-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }
  .session-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .session-location { font-family: var(--mono); font-size: 11px; color: var(--blue); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .session-network { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--green); font-family: var(--mono); }
  .session-title { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
  .session-time { font-size: 12px; color: var(--dim); font-family: var(--mono); }

  .speaker-card {
    background: var(--inset);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    padding: 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .speaker-role { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .speaker-role.host { color: var(--blue); }
  .speaker-role.guest { color: var(--indigo); }
  .speaker-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
  
  .audio-meter {
    height: 6px;
    background: var(--panel);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .audio-meter-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.15s ease-out;
  }
  .audio-meter-fill.host { background: linear-gradient(90deg, #3B82F6, #60A5FA); }
  .audio-meter-fill.guest { background: linear-gradient(90deg, #6366F1, #818CF8); }
  .meter-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); font-family: var(--mono); margin-top: 6px; }

  /* Right Column: Transcript */
  .transcript-col {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .transcript-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .transcript-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--green); font-family: var(--mono); }
  .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
  
  .transcript-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .transcript-body::-webkit-scrollbar { width: 6px; }
  .transcript-body::-webkit-scrollbar-track { background: transparent; }
  .transcript-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .transcript-msg {
    background: var(--inset);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    padding: 14px 16px;
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .transcript-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .transcript-time { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .transcript-speaker { font-size: 11px; font-weight: 700; }
  .transcript-speaker.host { color: var(--blue); }
  .transcript-speaker.guest { color: var(--indigo); }
  .transcript-text { font-size: 14px; color: var(--text); line-height: 1.6; }

  /* Concierge Trigger */
  .concierge-trigger {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 40;
  }
  .concierge-btn {
    background: linear-gradient(135deg, #2563EB, #4F46E5);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 16px 28px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 30px rgba(37,99,235,0.4);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .concierge-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(37,99,235,0.5); }
  .concierge-btn svg { width: 22px; height: 22px; }

  /* Concierge Modal */
  .concierge-modal {
    position: fixed;
    inset: 0;
    background: rgba(4,7,15,0.85);
    backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .concierge-modal.active { opacity: 1; pointer-events: auto; }
  
  .concierge-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    width: 90%;
    max-width: 560px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  /* Concierge States */
  .state-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
  }
  .state-icon svg { width: 36px; height: 36px; }
  
  .state-listening .state-icon { background: rgba(59,130,246,0.15); color: var(--blue); }
  .state-listening .state-icon::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2px solid var(--blue);
    animation: ripple 1.5s infinite;
  }
  @keyframes ripple {
    0% { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }

  .state-transcribing .state-icon { background: rgba(99,102,241,0.15); color: var(--indigo); }
  .state-processing .state-icon { background: rgba(245,158,11,0.15); color: var(--amber); }
  .state-responding .state-icon { background: rgba(16,185,129,0.15); color: var(--green); }

  .state-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .state-subtitle { font-size: 13px; color: var(--muted); max-width: 400px; line-height: 1.6; }
  
  .transcript-bubble {
    background: var(--inset);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    text-align: left;
    font-size: 15px;
    color: var(--text);
    line-height: 1.6;
    min-height: 60px;
  }
  .transcript-bubble .cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: var(--blue);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .loader {
    width: 40px;
    height: 40px;
    border: 3px solid var(--line);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .close-modal-btn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .close-modal-btn:hover { background: var(--line); color: var(--text); }

  /* Standby State (No active session) */
  .standby-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    color: var(--dim);
  }
  .standby-screen svg { width: 48px; height: 48px; opacity: 0.5; }
  .standby-screen h2 { font-size: 24px; color: var(--muted); font-weight: 600; }
  .standby-screen p { font-size: 14px; }

  /* Kiosk Topbar adjustments */
  .topbar.kiosk-topbar {
    background: rgba(4,7,15,0.9);
    padding: 10px 20px;
    border-bottom: 1px solid var(--line-soft);
  }
  .kiosk-exit {
    font-size: 11px;
    color: var(--dim);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
  }
  .kiosk-exit:hover { color: var(--text); }

  @media(max-width: 900px) {
    .kiosk-grid { grid-template-columns: 1fr; }
    .session-col { flex-direction: row; flex-wrap: wrap; }
    .session-header-card { width: 100%; }
    .speaker-card { min-width: 200px; }
  }
</style>
</head>
<body class="kiosk-mode">

<!-- SVG Sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="m10.3 3.9-8.5 14.2A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>

</svg>

<!-- Minimal Kiosk Topbar -->
<header class="topbar kiosk-topbar">
  <div class="brand" style="gap: 10px;">
    <div class="brand-mark" style="width:28px;height:28px;"><svg class="icon" style="width:14px;height:14px"><use href="#i-activity"/></svg></div>
    <div>
      <div class="brand-name" style="font-size:13px;">ZXSPRD<span style="color:#60A5FA"> AI</span></div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span class="mono" style="font-size:10px; color:var(--dim);" id="kioskClock">--:--:--</span>
    <button class="kiosk-exit" onclick="location.href='index.html?role=SUPER_ADMIN'">Exit Kiosk Mode →</button>
  </div>
</header>

<!-- Main Kiosk Shell -->
<div class="kiosk-shell">

  <!-- Emergency Broadcast Banner (Hidden by default) -->
  <div id="broadcastBanner" class="broadcast-banner" hidden>
    <div class="left">
      <div class="icon-wrap"><svg class="icon" style="width:18px;height:18px;color:#F59E0B"><use href="#i-alert"/></svg></div>
      <span id="broadcastText">ANNOUNCEMENT: Session starting in 5 minutes</span>
    </div>
    <span class="time" id="broadcastTime">10:24:12 AM</span>
  </div>

  <!-- Main Grid -->
  <div class="kiosk-grid">
    
    <!-- Left: Session & Speakers -->
    <div class="session-col" id="sessionCol">
      <!-- Rendered via JS (Standby or Active) -->
    </div>

    <!-- Right: Transcript -->
    <div class="transcript-col">
      <div class="transcript-header">
        <div class="transcript-title">
          <svg class="icon" style="width:16px;height:16px;color:var(--blue)"><use href="#i-message"/></svg>
          Real-Time Live Speech Transcript
        </div>
        <div class="live-indicator">
          <span class="live-dot"></span> Synchronized
        </div>
      </div>
      <div class="transcript-body" id="transcriptBody">
        <!-- Rendered via JS -->
      </div>
    </div>

  </div>
</div>

<!-- Concierge Trigger -->
<div class="concierge-trigger">
  <button class="concierge-btn" id="btnConcierge">
    <svg><use href="#i-sparkles"/></svg> Ask AI Concierge
  </button>
</div>

<!-- Concierge Modal -->
<div class="concierge-modal" id="conciergeModal">
  <div class="concierge-card" id="conciergeCard">
    <!-- States injected here -->
  </div>
</div>

<script>
/* ================= MINIMAL STORE & SEED ================= */
const ZXSeed = {
  version: 1, activeRole: "EDGE_KIOSK", activeTenantId: "tenant-wps-2026", activePodId: "POD-01",
  tenants: [
    { id: "tenant-wps-2026", name: "World Police Summit 2026", subdomain: "wps2026", tier: "Enterprise", maxPods: 20, assignedPods: 5, networkMode: "PRIVATE_OCI_VCN", llmProvider: "OCI Llama 3 70B (Private)", ttsProvider: "ElevenLabs Neural v2", temperature: 0.2, status: "Active", primaryColor: "#0F172A" }
  ],
  pods: [
    { id:"POD-01", tenantId:"tenant-wps-2026", macAddress:"AC:DE:48:00:11:22", location:"DWTC Hall A1 — Zone 1", pingMs:18, cpuUsage:22, memoryUsageGb:3.8, status:"Online", mic1Role:"Host (Speaker 1)", mic2Role:"Guest (Speaker 2)", mic1Gain:65, mic2Gain:42 }
  ],
  sessions: [
    { id:"sess-101", tenantId:"tenant-wps-2026", podId:"POD-01", title:"AI Governance in Sovereign Law Enforcement Data Ecosystems", startTime:"10:00 AM", endTime:"10:45 AM", speakerHost:"Dr. Aris Thorne (Chief AI Architect)", speakerGuest:"Elena Rostova (Cyber Security Director)", status:"Live", hitlApproved:false, summaryText:"Key Takeaways: 100% UAE local data residency confirmed." }
  ],
  documents: [],
  broadcasts: [
    { id:"bc-1", tenantId:"tenant-wps-2026", message:"Welcome to Hall A1 Intelligence Hub. All pods operational.", timestamp:"09:45:12", active:true }
  ],
  voiceQueries: []
};

const ZXStore = (() => {
  const KEY = "zxsprd-global-state-v1";
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const listeners = new Set();
  let state = JSON.parse(localStorage.getItem(KEY)) || clone(ZXSeed);
  if (state.version !== ZXSeed.version) state = clone(ZXSeed);

  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function notify() { listeners.forEach(fn => fn(state)); }

  return {
    get state() { return state; },
    set(patch) { state = { ...state, ...patch }; persist(); notify(); },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  };
})();

/* ================= KIOSK PAGE LOGIC ================= */
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // Clock
  function updateClock() {
    const now = new Date();
    $("#kioskClock").textContent = now.toLocaleTimeString('en-US', { hour12: true });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Mock Transcript Data
  const mockLines = [
    { speaker: 'host', text: "Welcome everyone. Today we are presenting the sovereign data cloud compliance matrix for international summits." },
    { speaker: 'guest', text: "Thank you. How does the 30-day automated data purge verify compliance with national regulations?" },
    { speaker: 'host', text: "The system utilizes a cryptographic shredding technique. Once the 30-day retention window closes, the encryption keys are destroyed, rendering the data mathematically unrecoverable." },
    { speaker: 'guest', text: "And this all happens locally on the OCI edge nodes without traversing the public internet?" },
    { speaker: 'host', text: "Correct. The VCN tunnel ensures zero public exposure. Let's look at the telemetry dashboard to demonstrate the latency bounds." },
    { speaker: 'guest', text: "Fascinating. What happens if the edge node loses connectivity to the central sovereign registry?" },
    { speaker: 'host', text: "The pod enters a deterministic offline mode. It continues to transcribe and cache locally, syncing via a secure queue once the VCN handshake is re-established." }
  ];
  let lineIndex = 0;

  // Render Session & Speakers
  function renderSession() {
    const pod = ZXStore.state.pods.find(p => p.id === ZXStore.state.activePodId) || ZXStore.state.pods[0];
    const session = ZXStore.state.sessions.find(s => s.podId === pod.id && s.status === 'Live');
    const col = $("#sessionCol");

    if (!session) {
      col.innerHTML = `
        <div class="standby-screen">
          <svg><use href="#i-activity"/></svg>
          <h2>Pod Standby</h2>
          <p>Waiting for active session assignment...</p>
        </div>
      `;
      return;
    }

    col.innerHTML = `
      <div class="session-header-card">
        <div class="session-meta">
          <span class="session-location">${esc(pod.location)}</span>
          <span class="session-network"><span class="live-dot"></span> OCI VCN · ${pod.pingMs}ms</span>
        </div>
        <div class="session-title">${esc(session.title)}</div>
        <div class="session-time">${esc(session.startTime)} - ${esc(session.endTime)}</div>
      </div>

      <div class="speaker-card">
        <div>
          <div class="speaker-role host">${esc(pod.mic1Role)}</div>
          <div class="speaker-name">${esc(session.speakerHost)}</div>
        </div>
        <div>
          <div class="audio-meter"><div class="audio-meter-fill host" id="meterHost" style="width: ${pod.mic1Gain}%"></div></div>
          <div class="meter-label"><span>CH 1</span><span id="meterHostVal">${pod.mic1Gain} dB</span></div>
        </div>
      </div>

      <div class="speaker-card">
        <div>
          <div class="speaker-role guest">${esc(pod.mic2Role)}</div>
          <div class="speaker-name">${esc(session.speakerGuest)}</div>
        </div>
        <div>
          <div class="audio-meter"><div class="audio-meter-fill guest" id="meterGuest" style="width: ${pod.mic2Gain}%"></div></div>
          <div class="meter-label"><span>CH 2</span><span id="meterGuestVal">${pod.mic2Gain} dB</span></div>
        </div>
      </div>
    `;
  }

  // Render Broadcast
  function renderBroadcast() {
    const bc = ZXStore.state.broadcasts.find(b => b.tenantId === ZXStore.state.activeTenantId && b.active);
    const banner = $("#broadcastBanner");
    if (bc) {
      banner.hidden = false;
      $("#broadcastText").textContent = `ANNOUNCEMENT: ${bc.message}`;
      $("#broadcastTime").textContent = bc.timestamp;
    } else {
      banner.hidden = true;
    }
  }

  // Transcript Stream
  function addTranscriptLine() {
    const session = ZXStore.state.sessions.find(s => s.podId === ZXStore.state.activePodId && s.status === 'Live');
    if (!session) return;

    const line = mockLines[lineIndex % mockLines.length];
    lineIndex++;
    
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const isHost = line.speaker === 'host';
    const speakerName = isHost ? session.speakerHost.split(' ')[0] + ' ' + session.speakerHost.split(' ')[1] : session.speakerGuest.split(' ')[0] + ' ' + session.speakerGuest.split(' ')[1];
    const roleClass = isHost ? 'host' : 'guest';

    const msgEl = document.createElement('div');
    msgEl.className = 'transcript-msg';
    msgEl.innerHTML = `
      <div class="transcript-meta">
        <span class="transcript-time">[${timeStr}]</span>
        <span class="transcript-speaker ${roleClass}">${esc(speakerName)} (${isHost ? 'Host' : 'Guest'})</span>
      </div>
      <div class="transcript-text">"${esc(line.text)}"</div>
    `;

    const body = $("#transcriptBody");
    body.appendChild(msgEl);
    
    // Auto-scroll
    body.scrollTop = body.scrollHeight;

    // Keep only last 20 messages to prevent DOM bloat
    while (body.children.length > 20) {
      body.removeChild(body.firstChild);
    }
  }

  // Audio Meters Simulation
  function updateMeters() {
    const pod = ZXStore.state.pods.find(p => p.id === ZXStore.state.activePodId);
    if (!pod) return;

    const g1 = Math.floor(Math.random() * 60) + 20;
    const g2 = Math.floor(Math.random() * 60) + 15;
    
    const mH = $("#meterHost");
    const mG = $("#meterGuest");
    if (mH) {
      mH.style.width = g1 + "%";
      $("#meterHostVal").textContent = g1 + " dB";
    }
    if (mG) {
      mG.style.width = g2 + "%";
      $("#meterGuestVal").textContent = g2 + " dB";
    }
  }

  // --- Concierge State Machine ---
  const QUERY = "Where is the VIP networking lounge located?";
  const RESPONSE = "The VIP Networking Lounge is located on Level 2, directly across from Escalator B in Hall A1.";
  let conciergeTimers = [];

  function clearConciergeTimers() {
    conciergeTimers.forEach(t => clearTimeout(t));
    conciergeTimers = [];
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  function openConcierge() {
    const modal = $("#conciergeModal");
    const card = $("#conciergeCard");
    modal.classList.add('active');
    
    // State 1: LISTENING
    card.className = 'concierge-card state-listening';
    card.innerHTML = `
      <div class="state-icon"><svg><use href="#i-mic"/></svg></div>
      <div class="state-title">Listening...</div>
      <div class="state-subtitle">Speak naturally into the pod boundary microphone.</div>
    `;

    // State 2: TRANSCRIBING
    conciergeTimers.push(setTimeout(() => {
      card.className = 'concierge-card state-transcribing';
      card.innerHTML = `
        <div class="state-icon"><svg><use href="#i-message"/></svg></div>
        <div class="state-title">Transcribing...</div>
        <div class="transcript-bubble" id="typeTarget"><span class="cursor"></span></div>
      `;
      typeText($("#typeTarget"), QUERY);
    }, 3000));

    // State 3: PROCESSING
    conciergeTimers.push(setTimeout(() => {
      card.className = 'concierge-card state-processing';
      card.innerHTML = `
        <div class="state-icon"><div class="loader"></div></div>
        <div class="state-title">Searching Vector Index...</div>
        <div class="state-subtitle">Querying OCI Sovereign Knowledge Base for spatial data...</div>
      `;
    }, 6500));

    // State 4: RESPONDING
    conciergeTimers.push(setTimeout(() => {
      card.className = 'concierge-card state-responding';
      card.innerHTML = `
        <div class="state-icon"><svg><use href="#i-volume"/></svg></div>
        <div class="state-title">AI Concierge Response</div>
        <div class="transcript-bubble">"${esc(RESPONSE)}"</div>
        <button class="close-modal-btn" id="btnCloseConcierge">Close & Return</button>
      `;
      
      // Trigger TTS
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(RESPONSE);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }

      // Log to store
      const newLog = {
        id: `log-${Date.now()}`,
        tenantId: ZXStore.state.activeTenantId,
        podId: ZXStore.state.activePodId,
        queryText: QUERY,
        responseText: RESPONSE,
        language: 'en',
        latencyMs: 420,
        timestamp: new Date().toLocaleTimeString()
      };
      ZXStore.set({ voiceQueries: [newLog, ...ZXStore.state.voiceQueries] });

      $("#btnCloseConcierge").addEventListener("click", closeConcierge);
    }, 9000));
  }

  function closeConcierge() {
    clearConciergeTimers();
    $("#conciergeModal").classList.remove('active');
  }

  function typeText(element, text) {
    let i = 0;
    const cursor = element.querySelector('.cursor');
    const interval = setInterval(() => {
      if (i < text.length) {
        element.insertBefore(document.createTextNode(text.charAt(i)), cursor);
        i++;
      } else {
        clearInterval(interval);
        if(cursor) cursor.remove();
      }
    }, 40);
    conciergeTimers.push(interval); // Add to cleanup list
  }

  // --- Initial Render & Listeners ---
  renderSession();
  renderBroadcast();
  
  // Add initial transcript lines
  for(let i=0; i<3; i++) addTranscriptLine();

  // Intervals
  setInterval(addTranscriptLine, 5000); // New line every 5s
  setInterval(updateMeters, 200); // Meters every 200ms

  // Concierge Trigger
  $("#btnConcierge").addEventListener("click", openConcierge);

  // Sync state if changed in another tab
  ZXStore.subscribe(() => {
    renderSession();
    renderBroadcast();
  });

  // Cleanup on page leave
  window.addEventListener('beforeunload', clearConciergeTimers);
})();
</script>
</body>
</html>
