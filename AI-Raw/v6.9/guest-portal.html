<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#090D16" />
<title>ZXSPRD AI — Guest Intelligence Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<style>
  /* Mobile Shell & Glassmorphism */
  body.guest-body { background: var(--bg); }
  .guest-app {
    max-width: 480px; margin: 0 auto; min-height: 100dvh; position: relative;
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
    background: 
      radial-gradient(ellipse 100% 45% at 50% 0%, var(--tenant-accent-soft), transparent),
      radial-gradient(ellipse 70% 40% at 100% 60%, rgba(99,102,241,.07), transparent),
      var(--bg);
  }
  @media (min-width: 700px) {
    .guest-app { border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); box-shadow: 0 0 100px rgba(0,0,0,.5); }
    body.guest-body { background-image: radial-gradient(ellipse 50% 50% at 20% 20%, rgba(59,130,246,.08), transparent), radial-gradient(ellipse 50% 50% at 80% 80%, rgba(16,185,129,.06), transparent), var(--bg); }
  }

  .guest-topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    background: rgba(9,13,22,.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(148,163,184,.1);
  }
  .guest-topbar-brand { display: flex; align-items: center; gap: 10px; }
  .guest-topbar-logo { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
  .guest-topbar-title { font-size: 12.5px; font-weight: 700; }
  .guest-topbar-sub { font-size: 9.5px; color: var(--dim); }

  .offline-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px; border-radius: 999px;
    font-size: 9.5px; font-weight: 600;
    background: rgba(245,158,11,.12); color: #FCD34D; border: 1px solid rgba(245,158,11,.25);
  }
  .offline-pill.online { background: rgba(16,185,129,.1); color: #6EE7B7; border-color: rgba(16,185,129,.22); }

  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--tenant-accent), #4F46E5);
    color: #fff; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; border: 2px solid rgba(255,255,255,.12);
  }
  .avatar.lg { width: 72px; height: 72px; font-size: 24px; }

  .guest-content { padding: 22px 20px; }

  /* Hero & Cards */
  .guest-hero {
    position: relative; overflow: hidden; border-radius: var(--radius-xl);
    padding: 26px 24px;
    background: linear-gradient(140deg, rgba(59,130,246,.18), rgba(15,23,42,.9) 60%);
    border: 1px solid rgba(148,163,184,.16); margin-bottom: 22px;
  }
  .guest-hero::before {
    content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px;
    border-radius: 50%; background: radial-gradient(circle, var(--tenant-accent-soft), transparent 70%);
    animation: floatOrb 9s ease-in-out infinite;
  }
  @keyframes floatOrb { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-24px, 26px) scale(1.12); } }
  
  .guest-hero-kicker { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--tenant-accent); font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .guest-hero h1 { font-size: 27px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; position: relative; z-index: 1; }
  .guest-hero p { font-size: 12px; color: var(--muted); margin-top: 9px; line-height: 1.65; position: relative; z-index: 1; }

  /* Entry Cards */
  .entry-grid { display: flex; flex-direction: column; gap: 14px; }
  .entry-card {
    position: relative; overflow: hidden; border-radius: 20px; padding: 22px;
    background: rgba(15,23,42,.7); backdrop-filter: blur(16px);
    border: 1px solid rgba(148,163,184,.16); text-align: left; width: 100%;
    transition: transform .25s var(--ease), border-color .25s, box-shadow .25s;
  }
  .entry-card:hover { transform: translateY(-3px); border-color: var(--tenant-accent); box-shadow: var(--shadow-md); }
  .entry-card.featured { background: linear-gradient(135deg, rgba(59,130,246,.2), rgba(15,23,42,.85)); border-color: rgba(59,130,246,.4); }
  .entry-card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .entry-icon { width: 46px; height: 46px; border-radius: 14px; background: var(--tenant-accent-soft); color: var(--tenant-accent); display: grid; place-items: center; flex-shrink: 0; border: 1px solid rgba(59,130,246,.2); }
  .entry-title { font-size: 15px; font-weight: 700; }
  .entry-sub { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
  .entry-desc { font-size: 12px; color: var(--muted); line-height: 1.7; }

  /* Session Cards */
  .session-card {
    position: relative; overflow: hidden; background: rgba(15,23,42,.72); backdrop-filter: blur(14px);
    border: 1px solid rgba(148,163,184,.14); border-radius: 20px; padding: 18px; margin-bottom: 14px;
    transition: transform .25s var(--ease), border-color .25s;
  }
  .session-card:hover { transform: translateY(-3px); border-color: rgba(148,163,184,.3); }
  .session-card.is-live { border-color: rgba(239,68,68,.35); background: linear-gradient(140deg, rgba(239,68,68,.07), rgba(15,23,42,.85)); }
  .session-card.is-saved { border-color: rgba(16,185,129,.3); }
  .session-time-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); background: var(--inset); border: 1px solid var(--line-soft); border-radius: 8px; padding: 5px 9px; }
  .session-card h3 { font-size: 15.5px; font-weight: 700; line-height: 1.4; letter-spacing: -.01em; margin: 10px 0; }
  .session-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10.5px; color: var(--dim); }
  .session-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .session-tag { font-size: 9.5px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: var(--tenant-accent-soft); color: var(--tenant-accent); }
  .session-tag.match { background: rgba(16,185,129,.12); color: #6EE7B7; }

  /* Timeline */
  .timeline { position: relative; padding-left: 26px; }
  .timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, var(--tenant-accent), var(--line)); border-radius: 2px; }
  .timeline-item { position: relative; padding-bottom: 22px; }
  .timeline-item::before { content: ""; position: absolute; left: -23px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--tenant-accent); box-shadow: 0 0 0 4px var(--tenant-accent-soft); }
  .timeline-item.is-complete::before { background: var(--tenant-accent); }
  .timeline-time { font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
  .timeline-title { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .timeline-desc { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.65; }

  /* Chat */
  .chat-panel { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 16px; }
  .chat-bubble { max-width: 86%; padding: 13px 16px; border-radius: 18px; font-size: 12.5px; line-height: 1.7; animation: slideUp .3s var(--ease); }
  .chat-bubble.user { align-self: flex-end; background: var(--tenant-accent); color: #fff; border-bottom-right-radius: 5px; }
  .chat-bubble.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 5px; color: var(--text); }
  .chat-composer { position: sticky; bottom: calc(88px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; padding: 10px; background: rgba(15,23,42,.95); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; z-index: 20; }
  .chat-composer input { flex: 1; background: transparent; border: none; outline: none; font-size: 12.5px; color: var(--text); min-width: 0; }
  .chat-composer .send-btn { width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0; background: var(--tenant-accent); color: #fff; display: grid; place-items: center; }

  /* Bottom Dock */
  .guest-dock {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 60;
    width: 100%; max-width: 480px;
    display: flex; align-items: center; justify-content: space-around;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    background: rgba(11,18,32,.94); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid rgba(148,163,184,.14);
  }
  .dock-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 7px 4px; border-radius: 12px; color: var(--dim); font-size: 9px; font-weight: 600; transition: color .2s; position: relative; }
  .dock-item svg.icon { width: 21px; height: 21px; transition: transform .25s var(--ease); }
  .dock-item.active { color: var(--tenant-accent); }
  .dock-item.active::before { content: ""; position: absolute; top: -10px; width: 22px; height: 3px; border-radius: 0 0 4px 4px; background: var(--tenant-accent); box-shadow: 0 0 12px var(--tenant-accent); }
  .dock-item.active svg.icon { transform: translateY(-2px); }
</style>
</head>
<body class="guest-body">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14h1v1h-1zM14 20h3v1h-3zM20 20h1v1h-1z"/></symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="m1 1 22 22M8.5 16.5a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-map-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
</svg>

<div class="guest-app" id="guestApp">
  <header class="guest-topbar">
    <div class="guest-topbar-brand">
      <div class="guest-topbar-logo"><img id="guestLogo" src="" alt="Logo" onerror="this.style.display='none'" /></div>
      <div>
        <div class="guest-topbar-title" id="guestEventName">Event Portal</div>
        <div class="guest-topbar-sub">Powered by ZXSPRD AI</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="offline-pill online" id="networkPill">
        <svg class="icon" style="width:10px;height:10px;"><use href="#i-wifi"/></svg> Live
      </div>
      <div class="avatar" id="userAvatar" style="display:none;">G</div>
    </div>
  </header>

  <div class="guest-content" id="guestContent"></div>

  <nav class="guest-dock" id="guestDock" style="display:none;">
    <button class="dock-item active" data-view="home"><svg class="icon"><use href="#i-home"/></svg> Home</button>
    <button class="dock-item" data-view="agenda"><svg class="icon"><use href="#i-calendar"/></svg> Agenda</button>
    <button class="dock-item" data-view="journey"><svg class="icon"><use href="#i-map"/></svg> Journey</button>
    <button class="dock-item" data-view="chat"><svg class="icon"><use href="#i-message"/></svg> Concierge</button>
    <button class="dock-item" data-view="profile"><svg class="icon"><use href="#i-user"/></svg> Profile</button>
  </nav>
</div>

<script src="mock-data.js"></script>
<script src="store.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  let currentView = 'landing';
  let currentUser = null; 
  let chatHistory = [];
  const allInterests = ["AI Governance", "Cloud Security", "Forensics", "Smart Policing", "Edge Computing", "Data Privacy"];
  
  const mockSessions = [
    { id: "s1", title: "Sovereign Cloud Architecture for Law Enforcement", time: "10:00 AM", loc: "Hall A1", host: "Dr. Aris Thorne", tags: ["Cloud Security", "AI Governance"], status: "live", match: 95 },
    { id: "s2", title: "Edge Inference & Low-Latency Analytics", time: "11:30 AM", loc: "Hall B2", host: "Elena Rostova", tags: ["Edge Computing", "AI Governance"], status: "upcoming", match: 88 },
    { id: "s3", title: "Digital Forensics in Encrypted Enclaves", time: "01:00 PM", loc: "Workshop 1", host: "Col. Majid Al Suwaidi", tags: ["Forensics", "Data Privacy"], status: "upcoming", match: 72 }
  ];

  function applyBranding() {
    const t = ZXStore.tenant();
    if (!t) return;
    document.documentElement.style.setProperty("--tenant-accent", t.primaryColor || "#3B82F6");
    $("#guestLogo").src = t.logoUrl;
    $("#guestEventName").textContent = t.headerText || t.name;
  }

  function renderView() {
    const content = $("#guestContent");
    if (!currentUser) { renderLanding(content); $("#guestDock").style.display = 'none'; $("#userAvatar").style.display = 'none'; return; }
    $("#guestDock").style.display = 'flex';
    $("#userAvatar").style.display = 'grid';
    $("#userAvatar").textContent = currentUser.name.charAt(0).toUpperCase();
    document.querySelectorAll('.dock-item').forEach(d => d.classList.toggle('active', d.dataset.view === currentView));

    if (currentView === 'home') renderHome(content);
    else if (currentView === 'agenda') renderAgenda(content);
    else if (currentView === 'journey') renderJourney(content);
    else if (currentView === 'chat') renderChat(content);
    else if (currentView === 'profile') renderProfile(content);
  }

  function renderLanding(el) {
    el.innerHTML = `
      <div style="text-align: center; padding: 30px 0 20px;">
        <div class="avatar lg" style="margin: 0 auto 16px; background: linear-gradient(135deg, var(--tenant-accent), #4F46E5);">
          <svg class="icon" style="width:32px;height:32px;"><use href="#i-activity"/></svg>
        </div>
        <h1 style="font-size: 24px; font-weight: 800;">Welcome to the Summit</h1>
        <p style="font-size: 13px; color: var(--muted); margin-top: 8px;">Access personalized agendas, live transcripts, and AI concierge services.</p>
      </div>
      <div class="entry-grid">
        <button class="entry-card featured" id="btnGuestEntry">
          <div class="entry-card-top">
            <div class="entry-icon"><svg class="icon"><use href="#i-sparkles"/></svg></div>
            <div style="text-align:left;"><div class="entry-title">Continue as Guest</div><div class="entry-sub">Zero setup · Instant access</div></div>
          </div>
          <div class="entry-desc">Select your interests to get a personalized feed of sessions.</div>
        </button>
        <button class="entry-card" id="btnBadgeEntry">
          <div class="entry-card-top">
            <div class="entry-icon" style="background: rgba(16,185,129,.12); color: #6EE7B7; border-color: rgba(16,185,129,.2);"><svg class="icon"><use href="#i-qr"/></svg></div>
            <div style="text-align:left;"><div class="entry-title">Scan Badge / Profile</div><div class="entry-sub">Passwordless sync</div></div>
          </div>
          <div class="entry-desc">Scan your physical summit badge to link your history and VIP access.</div>
        </button>
      </div>
    `;
    $("#btnGuestEntry").addEventListener('click', () => { currentUser = { name: "Guest Delegate", badgeId: null, interests: [], joinedSessions: [], type: 'guest' }; showInterestPicker(); });
    $("#btnBadgeEntry").addEventListener('click', () => {
      // Simulate Scan
      setTimeout(() => {
        currentUser = { name: "Elena Rostova", badgeId: "BDG-9941", interests: ["AI Governance", "Cloud Security"], joinedSessions: ["s1"], type: 'logged_in' };
        currentView = 'home'; renderView();
      }, 1500);
    });
  }

  function showInterestPicker() {
    const el = $("#guestContent");
    el.innerHTML = `
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">What are you interested in?</h2>
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 20px;">Select topics to personalize your agenda.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;" id="interestGrid">
        ${allInterests.map(i => `<button class="chip" data-interest="${i}">${i}</button>`).join("")}
      </div>
      <button class="btn btn-accent btn-block" style="margin-top: 30px; padding: 14px;" id="btnFinishOnboard">Continue to Portal</button>
    `;
    $("#interestGrid").addEventListener('click', e => {
      const chip = e.target.closest('.chip'); if (!chip) return;
      chip.classList.toggle('is-selected');
      const interest = chip.dataset.interest;
      if (currentUser.interests.includes(interest)) currentUser.interests = currentUser.interests.filter(i => i !== interest);
      else currentUser.interests.push(interest);
    });
    $("#btnFinishOnboard").addEventListener('click', () => { currentView = 'home'; renderView(); });
  }

  function renderHome(el) {
    const liveSessions = mockSessions.filter(s => s.status === 'live');
    const matchedSessions = mockSessions.filter(s => s.status === 'upcoming' && s.tags.some(t => currentUser.interests.includes(t))).slice(0, 2);
    
    // Check for targeted broadcasts
    const targetedBc = ZXStore.state.broadcasts.loggedInUsers.find(b => b.tenantId === ZXStore.state.activeTenantId && b.active);
    const generalBc = ZXStore.state.broadcasts.guestPortal.find(b => b.tenantId === ZXStore.state.activeTenantId && b.active);
    const activeBc = targetedBc || generalBc;

    el.innerHTML = `
      ${activeBc ? `<div style="background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); border-radius: 12px; padding: 12px; margin-bottom: 16px; font-size: 12px; color: #FCD34D; display: flex; align-items: center; gap: 8px;">
        <svg class="icon" style="width:16px;height:16px;color:#F59E0B;"><use href="#i-alert"/></svg> ${esc(activeBc.message)}
      </div>` : ''}
      <div class="guest-hero">
        <div class="guest-hero-kicker"><span class="live-dot"></span> Live Now</div>
        <h1>Welcome back, ${esc(currentUser.name.split(' ')[0])}.</h1>
        <p>You have ${matchedSessions.length} recommended sessions today based on your interests.</p>
      </div>
      <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 12px; display:flex; align-items:center; gap:8px;"><span class="live-dot"></span> Happening Right Now</h3>
      ${liveSessions.map(s => renderSessionCard(s)).join("")}
      <h3 style="font-size: 14px; font-weight: 700; margin: 20px 0 12px;">Recommended For You</h3>
      ${matchedSessions.map(s => renderSessionCard(s)).join("") || '<div style="font-size:12px; color:var(--dim);">No specific recommendations yet.</div>'}
    `;
  }

  function renderAgenda(el) {
    el.innerHTML = `
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Event Agenda</h2>
      <div id="agendaList">${mockSessions.map(s => renderSessionCard(s)).join("")}</div>
    `;
  }

  function renderJourney(el) {
    const attended = mockSessions.filter(s => currentUser.joinedSessions.includes(s.id));
    el.innerHTML = `
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">My Event Journey</h2>
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 20px;">Your interactive timeline of visited pods and sessions.</p>
      <div class="timeline">
        <div class="timeline-item is-complete"><div class="timeline-time">09:00 AM</div><div class="timeline-title">Badge Scanned at Registration</div></div>
        ${attended.map(s => `<div class="timeline-item is-complete"><div class="timeline-time">${esc(s.time)}</div><div class="timeline-title">${esc(s.title)}</div><div class="timeline-desc">Attended at ${esc(s.loc)}.</div></div>`).join("")}
        <div class="timeline-item"><div class="timeline-time">Now</div><div class="timeline-title">Exploring the Venue</div><div class="timeline-desc">Tap your badge at any pod to log your visit.</div></div>
      </div>
    `;
  }

  function renderChat(el) {
    el.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 18px; font-weight: 700;">AI Concierge</h2>
      </div>
      <div class="chat-panel" id="chatPanel">
        <div class="chat-bubble ai">Hello ${esc(currentUser.name.split(' ')[0])}! I'm your AI concierge. Ask me about the agenda or venue navigation.</div>
        ${chatHistory.map(msg => `<div class="chat-bubble ${msg.role}">${esc(msg.text)}</div>`).join("")}
      </div>
      <div class="chat-composer">
        <input type="text" id="chatInput" placeholder="Ask anything about the event..." />
        <button class="send-btn" id="btnSendChat"><svg class="icon"><use href="#i-send"/></svg></button>
      </div>
    `;
    const panel = $("#chatPanel"); const input = $("#chatInput");
    function sendMsg(text) {
      if (!text.trim()) return;
      chatHistory.push({ role: 'user', text }); renderChatBubble('user', text); input.value = "";
      setTimeout(() => {
        const aiReply = getMockAIReply(text); chatHistory.push({ role: 'ai', text: aiReply }); renderChatBubble('ai', aiReply);
      }, 1000);
    }
    function renderChatBubble(role, text) {
      const bubble = document.createElement('div'); bubble.className = `chat-bubble ${role}`; bubble.textContent = text;
      panel.appendChild(bubble); panel.scrollTop = panel.scrollHeight;
    }
    $("#btnSendChat").addEventListener('click', () => sendMsg(input.value));
    input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(input.value); });
  }

  function renderProfile(el) {
    el.innerHTML = `
      <div style="text-align: center; padding: 20px; background: linear-gradient(160deg, rgba(59,130,246,.12), var(--panel)); border: 1px solid rgba(148,163,184,.16); border-radius: var(--radius-xl); margin-bottom: 20px;">
        <div class="avatar lg" style="margin: 0 auto 14px;">${esc(currentUser.name.charAt(0))}</div>
        <div style="font-size: 19px; font-weight: 800;">${esc(currentUser.name)}</div>
        <div style="font-family: var(--font-mono); font-size: 10.5px; color: var(--dim); margin-top: 5px;">${currentUser.badgeId ? 'Badge: ' + esc(currentUser.badgeId) : 'Guest Access'}</div>
      </div>
      <button class="btn btn-red btn-block" id="btnLogout" style="justify-content: center; margin-top: 10px;">
        <svg class="icon"><use href="#i-x"/></svg> Log Out / Clear Session
      </button>
    `;
    $("#btnLogout").addEventListener('click', () => { currentUser = null; chatHistory = []; currentView = 'landing'; renderView(); });
  }

  function renderSessionCard(s) {
    const isMatch = s.tags.some(t => currentUser.interests.includes(t));
    return `
      <div class="session-card ${s.status === 'live' ? 'is-live' : ''} ${isMatch ? 'is-saved' : ''}" data-session="${s.id}">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="session-time-pill">${s.status === 'live' ? '<span class="live-dot" style="margin-right:4px;"></span> LIVE' : '<svg class="icon" style="width:10px;height:10px;"><use href="#i-clock"/></svg> ' + esc(s.time)}</span>
        </div>
        <h3>${esc(s.title)}</h3>
        <div class="session-meta"><span><svg class="icon" style="width:12px;height:12px;"><use href="#i-map-pin"/></svg> ${esc(s.loc)}</span><span><svg class="icon" style="width:12px;height:12px;"><use href="#i-user"/></svg> ${esc(s.host)}</span></div>
        <div class="session-tags">${s.tags.map(t => `<span class="session-tag ${currentUser.interests.includes(t) ? 'match' : ''}">${esc(t)}</span>`).join("")}</div>
      </div>
    `;
  }

  function getMockAIReply(q) {
    const lower = q.toLowerCase();
    if (lower.includes('vip')) return "The VIP Networking Lounge is located on Level 2, directly across from Escalator B.";
    if (lower.includes('wifi')) return "The guest Wi-Fi network is 'WPS_2026_Guest'. No password required, just accept the terms.";
    return "I've searched the event vector index. Could you provide a bit more detail?";
  }

  $("#guestDock").addEventListener('click', e => { const btn = e.target.closest('.dock-item'); if (!btn) return; currentView = btn.dataset.view; renderView(); });

  // Network Status Mock
  setInterval(() => {
    const pill = $("#networkPill");
    if (Math.random() > 0.95) {
      pill.className = 'offline-pill'; pill.innerHTML = '<svg class="icon" style="width:10px;height:10px;"><use href="#i-wifi-off"/></svg> Reconnecting...';
      setTimeout(() => { pill.className = 'offline-pill online'; pill.innerHTML = '<svg class="icon" style="width:10px;height:10px;"><use href="#i-wifi"/></svg> Live'; }, 2000);
    }
  }, 5000);

  applyBranding(); renderView(); ZXStore.subscribe(applyBranding);
})();
</script>
</body>
</html>
