<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#090D16" />
<title>ZXSPRD AI — Guest Intelligence Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<style>
  /* Page-specific overrides for Guest Portal */
  body.guest-body { background: var(--bg); }
  
  /* Scanner Overlay */
  .scanner-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(4,7,15,0.95); backdrop-filter: blur(12px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .scanner-overlay.active { opacity: 1; pointer-events: auto; }
  .scanner-text { color: var(--text); font-size: 14px; margin-top: 24px; font-weight: 600; }
  .scanner-sub { color: var(--dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body class="guest-body">

<!-- SVG Sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14h1v1h-1zM14 20h3v1h-3zM20 20h1v1h-1z"/></symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="m1 1 22 22M8.5 16.5a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-map-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
</svg>

<!-- ================= GUEST APP SHELL ================= -->
<div class="guest-app" id="guestApp">
  
  <!-- Topbar -->
  <header class="guest-topbar">
    <div class="guest-topbar-brand">
      <div class="guest-topbar-logo"><img id="guestLogo" src="" alt="Logo" onerror="this.style.display='none'" /></div>
      <div>
        <div class="guest-topbar-title" id="guestEventName">Event Portal</div>
        <div class="guest-topbar-sub">Powered by ZXSPRD AI</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="offline-pill online" id="networkPill">
        <svg class="icon" style="width:10px;height:10px;"><use href="#i-wifi"/></svg> Live
      </div>
      <div class="avatar" id="userAvatar" style="display:none;">G</div>
    </div>
  </header>

  <!-- Main Content Area -->
  <div class="guest-content" id="guestContent">
    <!-- Views injected here by JS -->
  </div>

  <!-- Bottom Dock Navigation -->
  <nav class="guest-dock" id="guestDock" style="display:none;">
    <button class="dock-item active" data-view="home">
      <svg class="icon"><use href="#i-home"/></svg> Home
    </button>
    <button class="dock-item" data-view="agenda">
      <svg class="icon"><use href="#i-calendar"/></svg> Agenda
    </button>
    <button class="dock-item" data-view="journey">
      <svg class="icon"><use href="#i-map"/></svg> Journey
    </button>
    <button class="dock-item" data-view="chat">
      <svg class="icon"><use href="#i-message"/></svg> Concierge
      <span class="dock-badge">1</span>
    </button>
    <button class="dock-item" data-view="profile">
      <svg class="icon"><use href="#i-user"/></svg> Profile
    </button>
  </nav>
</div>

<!-- Scanner Overlay -->
<div class="scanner-overlay" id="scannerOverlay">
  <div class="scan-frame">
    <div class="scan-corner tl"></div>
    <div class="scan-corner tr"></div>
    <div class="scan-corner bl"></div>
    <div class="scan-corner br"></div>
    <div class="scan-line"></div>
  </div>
  <div class="scanner-text">Scanning Badge...</div>
  <div class="scanner-sub">Align QR code within the frame</div>
  <button class="btn btn-ghost" style="margin-top: 30px;" onclick="document.getElementById('scannerOverlay').classList.remove('active')">Cancel</button>
</div>

<script src="mock-data.js"></script>
<script src="store.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  let currentView = 'landing';
  let currentUser = null; // { name, badgeId, interests: [] }
  let chatHistory = [];

  // --- Mock Data Helpers ---
  const allInterests = ["AI Governance", "Cloud Security", "Forensics", "Smart Policing", "Edge Computing", "Data Privacy"];
  
  const mockSessions = [
    { id: "s1", title: "Sovereign Cloud Architecture for Law Enforcement", time: "10:00 AM", loc: "Hall A1", host: "Dr. Aris Thorne", tags: ["Cloud Security", "AI Governance"], status: "live", match: 95 },
    { id: "s2", title: "Edge Inference & Low-Latency Analytics", time: "11:30 AM", loc: "Hall B2", host: "Elena Rostova", tags: ["Edge Computing", "AI Governance"], status: "upcoming", match: 88 },
    { id: "s3", title: "Digital Forensics in Encrypted Enclaves", time: "01:00 PM", loc: "Workshop 1", host: "Col. Majid Al Suwaidi", tags: ["Forensics", "Data Privacy"], status: "upcoming", match: 72 },
    { id: "s4", title: "Smart City Surveillance Ethics", time: "02:30 PM", loc: "Main Stage", host: "Dr. Lena Fischer", tags: ["Smart Policing", "Data Privacy"], status: "upcoming", match: 60 }
  ];

  // --- Renderers ---
  function applyBranding() {
    const t = ZXStore.tenant();
    if (!t) return;
    document.documentElement.style.setProperty("--tenant-accent", t.primaryColor || "#3B82F6");
    $("#guestLogo").src = t.logoUrl;
    $("#guestEventName").textContent = t.headerText || t.name;
  }

  function renderView() {
    const content = $("#guestContent");
    
    if (!currentUser) {
      renderLanding(content);
      $("#guestDock").style.display = 'none';
      $("#userAvatar").style.display = 'none';
      return;
    }

    $("#guestDock").style.display = 'flex';
    $("#userAvatar").style.display = 'grid';
    $("#userAvatar").textContent = currentUser.name.charAt(0).toUpperCase();

    // Update Dock Active State
    document.querySelectorAll('.dock-item').forEach(d => {
      d.classList.toggle('active', d.dataset.view === currentView);
    });

    if (currentView === 'home') renderHome(content);
    else if (currentView === 'agenda') renderAgenda(content);
    else if (currentView === 'journey') renderJourney(content);
    else if (currentView === 'chat') renderChat(content);
    else if (currentView === 'profile') renderProfile(content);
  }

  function renderLanding(el) {
    el.innerHTML = `
      <div style="text-align: center; padding: 30px 0 20px;">
        <div class="avatar lg" style="margin: 0 auto 16px; background: linear-gradient(135deg, var(--tenant-accent), #4F46E5);">
          <svg class="icon" style="width:32px;height:32px;"><use href="#i-activity"/></svg>
        </div>
        <h1 style="font-size: 24px; font-weight: 800;">Welcome to the Summit</h1>
        <p style="font-size: 13px; color: var(--muted); margin-top: 8px;">Access personalized agendas, live transcripts, and AI concierge services.</p>
      </div>

      <div class="entry-grid">
        <button class="entry-card featured" id="btnGuestEntry">
          <div class="entry-card-top">
            <div class="entry-icon"><svg class="icon"><use href="#i-sparkles"/></svg></div>
            <div style="text-align:left;">
              <div class="entry-title">Continue as Guest</div>
              <div class="entry-sub">Zero setup · Instant access</div>
            </div>
          </div>
          <div class="entry-desc">Select your interests to get a personalized feed of sessions, or just browse the live event pulse.</div>
          <div class="entry-arrow"><svg class="icon"><use href="#i-send"/></svg></div>
        </button>

        <button class="entry-card" id="btnBadgeEntry">
          <div class="entry-card-top">
            <div class="entry-icon" style="background: rgba(16,185,129,.12); color: #6EE7B7; border-color: rgba(16,185,129,.2);"><svg class="icon"><use href="#i-qr"/></svg></div>
            <div style="text-align:left;">
              <div class="entry-title">Scan Badge / Profile</div>
              <div class="entry-sub">Passwordless sync</div>
            </div>
          </div>
          <div class="entry-desc">Scan your physical summit badge to link your history, past sessions, and VIP access levels.</div>
          <div class="entry-arrow"><svg class="icon"><use href="#i-send"/></svg></div>
        </button>
      </div>
    `;

    $("#btnGuestEntry").addEventListener('click', () => {
      currentUser = { name: "Guest Delegate", badgeId: null, interests: [], joinedSessions: [] };
      showInterestPicker();
    });

    $("#btnBadgeEntry").addEventListener('click', () => {
      $("#scannerOverlay").classList.add('active');
      // Simulate scan
      setTimeout(() => {
        $("#scannerOverlay").classList.remove('active');
        currentUser = { name: "Elena Rostova", badgeId: "BDG-9941", interests: ["AI Governance", "Cloud Security"], joinedSessions: ["s1"] };
        currentView = 'home';
        renderView();
      }, 2500);
    });
  }

  function showInterestPicker() {
    const el = $("#guestContent");
    el.innerHTML = `
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">What are you interested in?</h2>
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 20px;">Select topics to personalize your agenda.</p>
      <div class="chip-grid" id="interestGrid">
        ${allInterests.map(i => `<button class="chip" data-interest="${i}">${i}</button>`).join("")}
      </div>
      <button class="btn btn-accent btn-block btn-lg" style="margin-top: 30px;" id="btnFinishOnboard">Continue to Portal</button>
    `;

    $("#interestGrid").addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      chip.classList.toggle('is-selected');
      const interest = chip.dataset.interest;
      if (currentUser.interests.includes(interest)) {
        currentUser.interests = currentUser.interests.filter(i => i !== interest);
      } else {
        currentUser.interests.push(interest);
      }
    });

    $("#btnFinishOnboard").addEventListener('click', () => {
      currentView = 'home';
      renderView();
    });
  }

  function renderHome(el) {
    const liveSessions = mockSessions.filter(s => s.status === 'live');
    const matchedSessions = mockSessions.filter(s => s.status === 'upcoming' && s.tags.some(t => currentUser.interests.includes(t))).slice(0, 2);
    
    el.innerHTML = `
      <div class="guest-hero">
        <div class="guest-hero-kicker"><span class="live-dot"></span> Live Now</div>
        <h1>Welcome back, ${esc(currentUser.name.split(' ')[0])}.</h1>
        <p>You have ${matchedSessions.length} recommended sessions today based on your interests.</p>
        <div class="guest-hero-meta">
          <span class="badge badge-blue">${currentUser.interests.length} Interests</span>
          <span class="badge badge-green">${currentUser.joinedSessions.length} Attended</span>
        </div>
      </div>

      <div class="guest-stat-strip">
        <div class="guest-stat"><div class="guest-stat-num" style="color:var(--green)">3</div><div class="guest-stat-label">Live Pods</div></div>
        <div class="guest-stat"><div class="guest-stat-num" style="color:var(--amber)">12</div><div class="guest-stat-label">Upcoming</div></div>
        <div class="guest-stat"><div class="guest-stat-num">${esc(currentUser.name.charAt(0))}</div><div class="guest-stat-label">Your Badge</div></div>
      </div>

      <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 12px; display:flex; align-items:center; gap:8px;">
        <span class="live-dot"></span> Happening Right Now
      </h3>
      ${liveSessions.map(s => renderSessionCard(s)).join("")}

      <h3 style="font-size: 14px; font-weight: 700; margin: 20px 0 12px;">Recommended For You</h3>
      ${matchedSessions.map(s => renderSessionCard(s)).join("")}
    `;
    bindSessionEvents();
  }

  function renderAgenda(el) {
    el.innerHTML = `
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Event Agenda</h2>
      <div class="tabs" style="margin-bottom: 20px;">
        <button class="tab active" data-tab="all">All Sessions</button>
        <button class="tab" data-tab="matched">My Matches</button>
        <button class="tab" data-tab="past">Past Summaries</button>
      </div>
      <div id="agendaList">
        ${mockSessions.map(s => renderSessionCard(s)).join("")}
      </div>
    `;
    bindSessionEvents();
    
    // Tab logic
    el.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        el.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const filter = tab.dataset.tab;
        let list = mockSessions;
        if (filter === 'matched') list = list.filter(s => s.tags.some(t => currentUser.interests.includes(t)));
        if (filter === 'past') list = ZXStore.meetings().filter(m => m.hitlStatus === 'Approved');
        
        $("#agendaList").innerHTML = filter === 'past' 
          ? list.map(m => `
            <div class="session-card is-saved">
              <div class="session-card-top"><span class="session-time-pill"><svg class="icon" style="width:10px;height:10px;"><use href="#i-check"/></svg> Approved Summary</span></div>
              <h3>${esc(m.title)}</h3>
              <div class="session-meta"><span>${esc(m.podId)}</span><span>Host: ${esc(m.hostName)}</span></div>
              <p style="font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.6;">${esc(m.aiSummary.substring(0, 120))}...</p>
            </div>
          `).join("") || '<div class="empty-state">No approved summaries yet.</div>'
          : list.map(s => renderSessionCard(s)).join("") || '<div class="empty-state">No sessions found.</div>';
        bindSessionEvents();
      });
    });
  }

  function renderJourney(el) {
    const attended = mockSessions.filter(s => currentUser.joinedSessions.includes(s.id));
    el.innerHTML = `
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">My Event Journey</h2>
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 20px;">Your interactive timeline of visited pods and sessions.</p>
      
      <div class="timeline">
        <div class="timeline-item is-complete">
          <div class="timeline-time">09:00 AM</div>
          <div class="timeline-title">Badge Scanned at Registration</div>
          <div class="timeline-desc">Welcome kit received. Access granted to all zones.</div>
        </div>
        ${attended.map(s => `
          <div class="timeline-item is-complete">
            <div class="timeline-time">${esc(s.time)}</div>
            <div class="timeline-title">${esc(s.title)}</div>
            <div class="timeline-desc">Attended at ${esc(s.loc)}. Host: ${esc(s.host)}.</div>
            <div class="timeline-actions">
              <button class="btn btn-ghost btn-sm">View Transcript</button>
              <button class="btn btn-ghost btn-sm">Save Summary</button>
            </div>
          </div>
        `).join("")}
        <div class="timeline-item">
          <div class="timeline-time">Now</div>
          <div class="timeline-title">Exploring the Venue</div>
          <div class="timeline-desc">Tap your badge at any pod to log your visit and get the AI summary.</div>
        </div>
      </div>
    `;
  }

  function renderChat(el) {
    el.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 18px; font-weight: 700;">AI Concierge</h2>
        <div class="lang-toggle">
          <button class="active">EN</button>
          <button>AR</button>
        </div>
      </div>
      
      <div class="chat-suggestions" id="chatSuggestions">
        <button class="chip" data-q="Where is the VIP lounge?">Where is the VIP lounge?</button>
        <button class="chip" data-q="Summarize the last keynote.">Summarize last keynote</button>
        <button class="chip" data-q="Find a quiet pod.">Find a quiet pod</button>
      </div>

      <div class="chat-panel" id="chatPanel">
        <div class="chat-bubble ai">
          Hello ${esc(currentUser.name.split(' ')[0])}! I'm your AI concierge. Ask me about the agenda, venue navigation, or session summaries.
        </div>
        ${chatHistory.map(msg => `
          <div class="chat-bubble ${msg.role}">${esc(msg.text)}</div>
        `).join("")}
      </div>

      <div class="chat-composer">
        <input type="text" id="chatInput" placeholder="Ask anything about the event..." />
        <button class="send-btn" id="btnSendChat"><svg class="icon"><use href="#i-send"/></svg></button>
      </div>
    `;

    // Chat Logic
    const panel = $("#chatPanel");
    const input = $("#chatInput");

    function sendMsg(text) {
      if (!text.trim()) return;
      chatHistory.push({ role: 'user', text });
      renderChatBubble('user', text);
      input.value = "";

      // Mock AI typing
      setTimeout(() => {
        const typingEl = document.createElement('div');
        typingEl.className = 'chat-bubble ai';
        typingEl.innerHTML = '<div class="chat-typing"><span></span><span></span><span></span></div>';
        panel.appendChild(typingEl);
        panel.scrollTop = panel.scrollHeight;

        setTimeout(() => {
          panel.removeChild(typingEl);
          const aiReply = getMockAIReply(text);
          chatHistory.push({ role: 'ai', text: aiReply });
          renderChatBubble('ai', aiReply);
        }, 1500);
      }, 500);
    }

    function renderChatBubble(role, text) {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${role}`;
      bubble.textContent = text;
      if (role === 'ai') {
        const src = document.createElement('span');
        src.className = 'chat-source';
        src.textContent = 'Source: OCI Sovereign Vector Index';
        bubble.appendChild(src);
      }
      panel.appendChild(bubble);
      panel.scrollTop = panel.scrollHeight;
    }

    $("#btnSendChat").addEventListener('click', () => sendMsg(input.value));
    input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(input.value); });
    
    $("#chatSuggestions").addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (chip) sendMsg(chip.dataset.q);
    });
  }

  function renderProfile(el) {
    el.innerHTML = `
      <div class="profile-card">
        <div class="avatar lg">${esc(currentUser.name.charAt(0))}</div>
        <div class="profile-name">${esc(currentUser.name)}</div>
        <div class="profile-badge-id">${currentUser.badgeId ? 'Badge: ' + esc(currentUser.badgeId) : 'Guest Access'}</div>
        <div class="profile-contact">Secure Passwordless Profile</div>
      </div>

      <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">My Interests</h3>
      <div class="chip-grid" style="margin-bottom: 24px;">
        ${currentUser.interests.length ? currentUser.interests.map(i => `<span class="chip is-selected">${i}</span>`).join("") : '<div class="dim" style="font-size:12px;">No interests selected yet.</div>'}
      </div>

      <h3 style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">Settings</h3>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn btn-ghost btn-block" style="justify-content: flex-start;">
          <svg class="icon"><use href="#i-globe"/></svg> Language & Accessibility
        </button>
        <button class="btn btn-ghost btn-block" style="justify-content: flex-start;">
          <svg class="icon"><use href="#i-bookmark"/></svg> Saved Summaries & Notes
        </button>
        <button class="btn btn-red btn-block" id="btnLogout" style="justify-content: center; margin-top: 10px;">
          <svg class="icon"><use href="#i-x"/></svg> Log Out / Clear Session
        </button>
      </div>
    `;

    $("#btnLogout").addEventListener('click', () => {
      currentUser = null;
      chatHistory = [];
      currentView = 'landing';
      renderView();
    });
  }

  // --- Helpers ---
  function renderSessionCard(s) {
    const isMatch = s.tags.some(t => currentUser.interests.includes(t));
    return `
      <div class="session-card ${s.status === 'live' ? 'is-live' : ''} ${isMatch ? 'is-saved' : ''}" data-session="${s.id}">
        <div class="session-card-top">
          <span class="session-time-pill">
            ${s.status === 'live' ? '<span class="live-dot" style="margin-right:4px;"></span> LIVE' : '<svg class="icon" style="width:10px;height:10px;"><use href="#i-clock"/></svg> ' + esc(s.time)}
          </span>
          <button class="icon-btn"><svg class="icon"><use href="#i-bookmark"/></svg></button>
        </div>
        <h3>${esc(s.title)}</h3>
        <div class="session-meta">
          <span><svg class="icon"><use href="#i-map-pin"/></svg> ${esc(s.loc)}</span>
          <span><svg class="icon"><use href="#i-user"/></svg> ${esc(s.host)}</span>
        </div>
        <div class="session-tags">
          ${s.tags.map(t => `<span class="session-tag ${currentUser.interests.includes(t) ? 'match' : ''}">${esc(t)}</span>`).join("")}
        </div>
        <div class="session-card-foot">
          ${isMatch ? `<span class="match-score"><svg class="icon"><use href="#i-check"/></svg> ${s.match}% Match</span>` : '<span></span>'}
          <button class="btn btn-ghost btn-sm">View Details</button>
        </div>
      </div>
    `;
  }

  function bindSessionEvents() {
    document.querySelectorAll('.session-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('.icon-btn') || e.target.closest('.btn')) return;
        const id = card.dataset.session;
        if (id && !currentUser.joinedSessions.includes(id)) {
          currentUser.joinedSessions.push(id);
          card.classList.add('is-saved');
          // Visual feedback
          card.style.borderColor = 'rgba(16,185,129,.5)';
          setTimeout(() => { card.style.borderColor = ''; }, 1000);
        }
      });
    });
  }

  function getMockAIReply(q) {
    const lower = q.toLowerCase();
    if (lower.includes('vip')) return "The VIP Networking Lounge is located on Level 2, directly across from Escalator B. It is currently at 60% capacity.";
    if (lower.includes('summarize') || lower.includes('keynote')) return "The opening keynote focused on 'Sovereign Cloud Architecture'. Key takeaway: 100% of local data residency is now mandated on OCI edge nodes with a 30-day cryptographic purge.";
    if (lower.includes('quiet') || lower.includes('pod')) return "Pod 04 in Hall C3 is currently empty and available for quiet work. Pod 01 is at 90% capacity.";
    return "I've searched the event vector index. Could you provide a bit more detail about what you're looking for?";
  }

  // --- Dock Navigation ---
  $("#guestDock").addEventListener('click', e => {
    const btn = e.target.closest('.dock-item');
    if (!btn) return;
    currentView = btn.dataset.view;
    renderView();
  });

  // --- Network Status Mock ---
  setInterval(() => {
    const pill = $("#networkPill");
    if (Math.random() > 0.95) {
      pill.className = 'offline-pill';
      pill.innerHTML = '<svg class="icon" style="width:10px;height:10px;"><use href="#i-wifi-off"/></svg> Reconnecting...';
      setTimeout(() => {
        pill.className = 'offline-pill online';
        pill.innerHTML = '<svg class="icon" style="width:10px;height:10px;"><use href="#i-wifi"/></svg> Live';
      }, 2000);
    }
  }, 5000);

  // --- Init ---
  applyBranding();
  renderView();
  ZXStore.subscribe(applyBranding);
})();
</script>
</body>
</html>
